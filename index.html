<div id="login-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--soft);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;">

     <input type="password" id="password-input" autocomplete="current-password" placeholder="Parol" class="nr input" style="width:100%;padding:10px;margin-bottom:15px;border:1px solid var(--line);border-radius:10px;outline:0;">
     <button class="btn" style="width:100%" onclick="tizimgaKirish()">Kirish</button>
